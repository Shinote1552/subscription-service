version: '3.8'

services:
  subscription-service:
    build:
      context: .
      dockerfile: dockerfile
    container_name: subscription-service
    ports:
      - "8080:8080"
    environment:
      - HTTP_PORT=8080
      - HTTP_READ_TIMEOUT=10s
      - HTTP_WRITE_TIMEOUT=10s
      - HTTP_IDLE_TIMEOUT=60s
      - HTTP_READ_HEADER_TIMEOUT=5s
      - DATABASE_URL=postgres://user:password@subscription-db:5432/subscriptions?sslmode=disable
      - DB_MAX_OPEN_CONNS=5
      - DB_MAX_IDLE_CONNS=2
      - DB_CONN_MAX_IDLE_TIME=2m
      - DB_CONN_MAX_LIFETIME=30m
      - LOG_LEVEL=info
    depends_on:
      subscription-db:
        condition: service_healthy
    networks:
      - subscription-network
    restart: unless-stopped

  subscription-db:
    image: postgres:15-alpine
    container_name: subscription-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: subscriptions
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d subscriptions"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - subscription-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  subscription-network:
    driver: bridge